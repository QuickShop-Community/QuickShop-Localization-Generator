# Override file to override generated metadata.
#
# Example:
# gui.staff.title:
#   category: gui
#   description: Title displayed at the top of the shop staff management GUI.
#   audience:
#     - shop-owner
#
# player-bought-from-your-store-tax:
#   category: transactions
#   description: Sent to a shop owner when another player purchases from their shop and tax is charged.
#   audience:
#     - shop-owner
#   placeholders:
#     "0": Buyer
#     "1": Amount purchased
#     "2": Item
#     "3": Earnings
#     "4": Tax charged

3rd-plugin-build-check-failed:
  category: protection
  description: Message shown when a third-party protection plugin denies a shop build or placement permission check.
  audience:
    - player
  placeholders:
    '0': Reason returned by the protection check
3rd-plugin-build-check-failed-admin:
  category: protection
  description: Administrator-facing diagnostic shown when a third-party protection plugin denies a permission check, including
    the listener that can be blacklisted if the denial is unexpected.
  audience:
    - server-administrator
  placeholders:
    '0': Reason returned by the protection check
    '1': Protection listener or integration identifier
_comment:
